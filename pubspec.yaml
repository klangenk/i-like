name: i_like
description: "Rate anything - products, books, movies, series, places, URLs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Routing
  go_router: ^14.8.1

  # Barcode Scanner
  mobile_scanner: ^6.0.7

  # URL Preview
  any_link_preview: ^3.0.2

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  file_picker: ^8.0.0
  intl: ^0.20.2

  # Local Storage
  shared_preferences: ^2.3.4

  # Receive share intents
  receive_sharing_intent: ^1.8.1

  # HTTP
  http: ^1.3.0
  cached_network_image: ^3.4.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  generate: true
  uses-material-design: true
